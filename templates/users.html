{% extends 'base.html' %}{% block content %}<h1>Хэрэглэгчийн эрх</h1><section class="panel"><h2>Хэрэглэгч нэмэх</h2><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><div class="formgrid"><div><label>Хэрэглэгчийн нэр</label><input name="username" minlength="3" required></div><div><label>Нууц үг (12+ тэмдэгт)</label><input type="password" name="password" minlength="12" required></div><div><label>Эрх</label><select name="role"><option value="viewer">Viewer · Зөвхөн харах</option><option value="operator">Operator · Бүртгэл/төлөлт</option><option value="admin">Admin · Бүх эрх</option></select></div></div><button>Үүсгэх</button></form></section><section class="panel"><table><tr><th>Нэр</th><th>Эрх</th><th>Төлөв</th><th>Үйлдэл</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{roles[u.role]}}</td><td>{{'Идэвхтэй' if u.active else 'Хаалттай'}}</td><td>{% if u.id!=me.id %}<form method="post" action="{{url_for('toggle_user',user_id=u.id)}}"><input type="hidden" name="csrf" value="{{csrf}}"><button class="secondary">{{'Хаах' if u.active else 'Идэвхжүүлэх'}}</button></form>{% endif %}</td></tr>{% endfor %}</table></section>{% endblock %}
