{% extends 'base.html' %}{% block content %}<h1>Шинэ зээл бүртгэх</h1><section class="panel">{% if not borrowers %}<p>Эхлээд <a href="{{url_for('borrowers')}}">зээлдэгч бүртгэнэ</a>.</p>{% else %}<form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><div class="formgrid"><div><label>Зээлдэгч</label><select name="borrower_id" required>{% for b in borrowers %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></div><div><label>Гэрээний дугаар</label><input name="contract" required></div><div><label>Зээлийн дүн (MNT)</label><input name="amount" type="number" min="1" step="0.01" required></div><div><label>Жилийн хүү (%)</label><input name="rate" type="number" min="0" max="1000" step="0.0001" required></div><div><label>Нэмэгдүүлсэн жилийн хүү (%)</label><input name="penalty_rate" type="number" min="0" max="1000" step="0.0001" value="0" required></div><div><label>Хугацаа (сар)</label><input name="months" type="number" min="1" max="360" required></div><div><label>Олгосон огноо</label><input type="date" name="start_date" value="{{today}}" required></div><div><label>График</label><select name="method"><option value="annuity">Аннуитет</option><option value="equal">Үндсэн тэнцүү</option><option value="bullet">Bullet</option></select></div></div><button>График үүсгэж хадгалах</button></form>{% endif %}</section>{% endblock %}
