{% extends 'base.html' %}{% block content %}<h1>Зээлдэгчид</h1>{% if me.role in ['admin','operator'] %}<section class="panel"><h2>Шинэ зээлдэгч</h2><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><div class="formgrid"><div><label>Төрөл</label><select name="kind"><option>Иргэн</option><option>Байгууллага</option></select></div><div><label>Нэр</label><input name="name" required></div><div><label>Регистр</label><input name="registration"></div><div><label>Утас</label><input name="phone"></div><div><label>Хаяг</label><input name="address"></div></div><button>Хадгалах</button></form></section>{% endif %}<section class="panel"><div class="scroll"><table><tr><th>ID</th><th>Төрөл</th><th>Нэр</th><th>Регистр</th><th>Утас</th></tr>{% for b in borrowers %}<tr><td>{{b.id}}</td><td>{{b.kind}}</td><td>{{b.name}}</td><td>{{b.registration or ''}}</td><td>{{b.phone or ''}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
